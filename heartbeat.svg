<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Host agent heartbeat: GPU, VRAM, temperature, power, PCIe, CPU, RAM, disk and network, reported every 30 seconds">
<style>.bar { transform-box: fill-box; transform-origin: left center; animation: j 2.4s ease-in-out infinite alternate; }
@keyframes j { 0% { transform: scaleX(.9); } 40% { transform: scaleX(1); } 70% { transform: scaleX(.94); } 100% { transform: scaleX(.98); } }
.ecg { animation: ecg 3s linear infinite; }
@keyframes ecg { from { transform: translateX(0); } to { transform: translateX(-300px); } }
.dot { animation: blink 1.2s ease-in-out infinite; } @keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0915"/><stop offset="1" stop-color="#151021"/></linearGradient>
    <linearGradient id="vio" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
<clipPath id="ecgclip"><rect x="770" y="120" width="390" height="120"/></clipPath>
<rect width="1200" height="560" rx="18" fill="url(#bg)"/><rect width="1200" height="560" rx="18" fill="url(#grid)"/>
