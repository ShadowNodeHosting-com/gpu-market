<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="ShadowNode GPU Market: renters pay hosts directly, the platform never holds funds">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: load 3.2s ease-in-out infinite alternate; }
    .b2 { animation-duration: 2.6s; animation-delay: -1.1s; }
    .b3 { animation-duration: 3.8s; animation-delay: -2s; }
    .b4 { animation-duration: 2.9s; animation-delay: -0.4s; }
    @keyframes load { 0% { transform: scaleX(.35); } 50% { transform: scaleX(.92); } 100% { transform: scaleX(.6); } }
    .led { animation: blink 1.6s ease-in-out infinite; }
    .l2 { animation-delay: -.4s; } .l3 { animation-delay: -.8s; } .l4 { animation-delay: -1.2s; }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { 0% { transform: translateX(-200px); } 100% { transform: translateX(1400px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0915"/><stop offset="1" stop-color="#151021"/>
    </linearGradient>
    <linearGradient id="vio" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/><stop offset=".5" stop-color="#a855f7" stop-opacity=".18"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="200" height="380" fill="url(#sweep)"/>

  <text x="60" y="78" class="mono" font-size="15" fill="#a855f7" letter-spacing="3">PEER-TO-PEER · NON-CUSTODIAL · NO ID UPLOAD</text>
  <text x="60" y="132" class="sans" font-size="52" font-weight="700" fill="#f4f0fa">ShadowNode <tspan fill="url(#vio)">GPU Market</tspan></text>
  <text x="60" y="172" class="sans" font-size="20" fill="#b8aecb">Renters pay the host's wallet directly. The platform never touches the money.</text>

  <!-- four GPU cards with live load bars -->
  <g class="mono" font-size="13">
    <g transform="translate(60 200)">
      <rect width="250" height="64" rx="10" fill="#1b1528" stroke="#3a2d55"/>
      <circle class="led" cx="18" cy="20" r="5" fill="#4ade80"/>
      <text x="32" y="25" fill="#e9e3f5">RTX 4090 · 24 GB</text><text x="236" y="25" fill="#8b7fa3" text-anchor="end">FRA</text>
      <rect x="16" y="40" width="218" height="8" rx="4" fill="#2a2140"/>
      <rect class="bar" x="16" y="40" width="218" height="8" rx="4" fill="url(#vio)"/>
    </g>
    <g transform="translate(330 200)">
      <rect width="250" height="64" rx="10" fill="#1b1528" stroke="#3a2d55"/>
      <circle class="led l2" cx="18" cy="20" r="5" fill="#4ade80"/>
      <text x="32" y="25" fill="#e9e3f5">RTX 5090 · 32 GB</text><text x="236" y="25" fill="#8b7fa3" text-anchor="end">AMS</text>
      <rect x="16" y="40" width="218" height="8" rx="4" fill="#2a2140"/>
      <rect class="bar b2" x="16" y="40" width="218" height="8" rx="4" fill="url(#vio)"/>
    </g>
    <g transform="translate(600 200)">
      <rect width="250" height="64" rx="10" fill="#1b1528" stroke="#3a2d55"/>
      <circle class="led l3" cx="18" cy="20" r="5" fill="#4ade80"/>
      <text x="32" y="25" fill="#e9e3f5">RTX 3090 · 24 GB</text><text x="236" y="25" fill="#8b7fa3" text-anchor="end">WAW</text>
      <rect x="16" y="40" width="218" height="8" rx="4" fill="#2a2140"/>
      <rect class="bar b3" x="16" y="40" width="218" height="8" rx="4" fill="url(#vio)"/>
    </g>
    <g transform="translate(870 200)">
      <rect width="270" height="64" rx="10" fill="#1b1528" stroke="#3a2d55"/>
      <circle class="led l4" cx="18" cy="20" r="5" fill="#4ade80"/>
      <text x="32" y="25" fill="#e9e3f5">RTX 5070 Ti · 16 GB</text><text x="256" y="25" fill="#8b7fa3" text-anchor="end">SEL</text>
      <rect x="16" y="40" width="238" height="8" rx="4" fill="#2a2140"/>
      <rect class="bar b4" x="16" y="40" width="238" height="8" rx="4" fill="url(#vio)"/>
    </g>
  </g>

  <!-- wallet to wallet -->
  <g class="mono" font-size="14">
    <rect x="60" y="298" width="232" height="40" rx="20" fill="#1b1528" stroke="#a855f7" stroke-opacity=".5"/>
    <text x="176" y="323" fill="#e9e3f5" text-anchor="middle">renter wallet</text>
    <line x1="300" y1="318" x2="900" y2="318" stroke="#a855f7" stroke-opacity=".35" stroke-dasharray="4 8"/>
    <text x="600" y="306" fill="#8b7fa3" text-anchor="middle">1.203817 USDT · direct, on-chain</text>
    <rect x="908" y="298" width="232" height="40" rx="20" fill="#1b1528" stroke="#4ade80" stroke-opacity=".6"/>
    <text x="1024" y="323" fill="#e9e3f5" text-anchor="middle">host wallet</text>
    <circle r="6" cy="318" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" from="300" to="900" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" cy="318" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" from="300" to="900" dur="3s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" cy="318" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" from="300" to="900" dur="3s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
