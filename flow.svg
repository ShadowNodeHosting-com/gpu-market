<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Rental flow: pick, pay the host wallet, on-chain verification, automatic container start, SSH access">
<style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0915"/><stop offset="1" stop-color="#151021"/></linearGradient>
    <linearGradient id="vio" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
<rect width="1200" height="400" rx="18" fill="url(#bg)"/><rect width="1200" height="400" rx="18" fill="url(#grid)"/>
<text x="40" y="58" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a855f7" letter-spacing="3">ONE RENTAL, FULLY AUTOMATIC</text>
<text x="40" y="96" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#f4f0fa">From payment to SSH in minutes. No human in the loop.</text>
<g transform="translate(40 130)"><rect width="210" height="130" rx="14" fill="#1b1528" stroke="#3a2d55"/><rect width="210" height="130" rx="14" fill="#a855f7" fill-opacity=".14" stroke="#c084fc" stroke-width="2" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.18;0.20;1" dur="10s" repeatCount="indefinite"/></rect><text x="20" y="40" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a855f7">01</text><text x="20" y="70" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f4f0fa">PICK</text><text x="20" y="96" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">GPU · block length</text><text x="20" y="116" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">image · SSH key</text></g>
<path d="M253 195 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#5b4a80" stroke-width="2"/>
<g transform="translate(268 130)"><rect width="210" height="130" rx="14" fill="#1b1528" stroke="#3a2d55"/><rect width="210" height="130" rx="14" fill="#a855f7" fill-opacity=".14" stroke="#c084fc" stroke-width="2" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.22;0.38;0.40;1" dur="10s" repeatCount="indefinite"/></rect><text x="20" y="40" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a855f7">02</text><text x="20" y="70" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f4f0fa">PAY</text><text x="20" y="96" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">unique amount</text><text x="20" y="116" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">→ host wallet</text></g>
<path d="M481 195 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#5b4a80" stroke-width="2"/>
<g transform="translate(496 130)"><rect width="210" height="130" rx="14" fill="#1b1528" stroke="#3a2d55"/><rect width="210" height="130" rx="14" fill="#a855f7" fill-opacity=".14" stroke="#c084fc" stroke-width="2" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.58;0.60;1" dur="10s" repeatCount="indefinite"/></rect><text x="20" y="40" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a855f7">03</text><text x="20" y="70" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f4f0fa">VERIFY</text><text x="20" y="96" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">agent + platform</text><text x="20" y="116" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">both check chain</text></g>
<path d="M709 195 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#5b4a80" stroke-width="2"/>
<g transform="translate(724 130)"><rect width="210" height="130" rx="14" fill="#1b1528" stroke="#3a2d55"/><rect width="210" height="130" rx="14" fill="#a855f7" fill-opacity=".14" stroke="#c084fc" stroke-width="2" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.62;0.78;0.80;1" dur="10s" repeatCount="indefinite"/></rect><text x="20" y="40" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a855f7">04</text><text x="20" y="70" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f4f0fa">START</text><text x="20" y="96" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">pull image, GPU,</text><text x="20" y="116" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">inject SSH key</text></g>
<path d="M937 195 l12 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#5b4a80" stroke-width="2"/>
<g transform="translate(952 130)"><rect width="210" height="130" rx="14" fill="#1b1528" stroke="#3a2d55"/><rect width="210" height="130" rx="14" fill="#a855f7" fill-opacity=".14" stroke="#c084fc" stroke-width="2" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.80;0.82;1" dur="10s" repeatCount="indefinite"/></rect><text x="20" y="40" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a855f7">05</text><text x="20" y="70" font-family="'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f4f0fa">CONNECT</text><text x="20" y="96" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">ssh -p 40123</text><text x="20" y="116" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8aecb">root@host</text></g>
<line x1="145.0" y1="300" x2="1057.0" y2="300" stroke="#3a2d55" stroke-width="4" stroke-linecap="round"/>
<circle cx="145.0" cy="300" r="7" fill="#1b1528" stroke="#5b4a80" stroke-width="2"/>
<circle cx="373.0" cy="300" r="7" fill="#1b1528" stroke="#5b4a80" stroke-width="2"/>
<circle cx="601.0" cy="300" r="7" fill="#1b1528" stroke="#5b4a80" stroke-width="2"/>
<circle cx="829.0" cy="300" r="7" fill="#1b1528" stroke="#5b4a80" stroke-width="2"/>
<circle cx="1057.0" cy="300" r="7" fill="#1b1528" stroke="#5b4a80" stroke-width="2"/>
<circle cy="300" r="9" fill="#c084fc" filter="url(#glow)" cx="145.0"><animate attributeName="cx" values="145.0;145.0;373.0;373.0;601.0;601.0;829.0;829.0;1057.0;1057.0" keyTimes="0.00;0.15;0.23;0.35;0.43;0.55;0.63;0.75;0.83;1.00" dur="10s" repeatCount="indefinite"/></circle>
<text x="40" y="352" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b7fa3">block ends → renter pays the next block, or the agent stops and wipes the container after a short grace period</text>
</svg>